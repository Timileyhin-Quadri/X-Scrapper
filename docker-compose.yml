version: "3.8"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-x_research}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  collector:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-x_research}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DEFAULT_QUERY: ${DEFAULT_QUERY:-#PutSouthAfricaFirst -is:retweet}
      X_USERNAME: ${X_USERNAME}
      X_PASSWORD: ${X_PASSWORD}
      X_EMAIL: ${X_EMAIL}
    command: >
      python scripts/scrape_tweets.py
        --query "${DEFAULT_QUERY:-#PutSouthAfricaFirst -is:retweet}"
        --target 10000

volumes:
  pgdata:
